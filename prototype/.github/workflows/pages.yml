name: Publish prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and validate static prototype
        run: npm run build:site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check reviewed source and Admin rules
        run: npm run check:baseline && npm run check:admin && npm run check:handoff
      - name: Check static routes and references
        run: npm run check:static
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
